name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '버전(예: 0.1.0). 비우면 Directory.Build.props의 값 사용'
        required: false
        default: ''

permissions:
  contents: write

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  CONFIGURATION: Release

jobs:
  build:
    name: Build (${{ matrix.arch }} / ${{ matrix.variant }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # 경량판: 코어와 geodata 미포함, 첫 실행 때 네트워크로 다운로드(용량 작음)
          - arch: x64
            rid: win-x64
            platform: x64
            variant: slim
            karch: amd64
          - arch: arm64
            rid: win-arm64
            platform: ARM64
            variant: slim
            karch: arm64
          # 완전판: 코어와 geodata 내장, 바로 사용 가능(용량 큼)
          - arch: x64
            rid: win-x64
            platform: x64
            variant: full
            karch: amd64
          - arch: arm64
            rid: win-arm64
            platform: ARM64
            variant: full
            karch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $v = "${{ github.event.inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($v) -and $env:GITHUB_REF -like 'refs/tags/v*') {
            $v = $env:GITHUB_REF -replace '^refs/tags/v', ''
          }
          if ([string]::IsNullOrWhiteSpace($v)) { $v = '0.1.0' }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Resolved version: $v"

      - name: Publish
        shell: pwsh
        run: |
          dotnet publish src/Resenz.App/Resenz.App.csproj `
            -c $env:CONFIGURATION `
            -r ${{ matrix.rid }} `
            --self-contained `
            -p:Platform=${{ matrix.platform }} `
            -p:Version=${{ steps.ver.outputs.version }} `
            -o publish

      - name: Fetch bundled kernel & geodata
        if: matrix.variant == 'full'
        shell: pwsh
        run: |
          pwsh -File build/fetch-bundle.ps1 -DestDir "publish/bundled" -Arch ${{ matrix.karch }}

      - name: Package portable zip
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          $suffix = if ("${{ matrix.variant }}" -eq "full") { "full" } else { "portable" }
          $zip = "Resenz-$ver-${{ matrix.arch }}-$suffix.zip"
          Compress-Archive -Path "publish/*" -DestinationPath $zip -CompressionLevel Optimal
          Write-Host "Created $zip"

      - name: Install Inno Setup
        if: matrix.arch == 'x64'
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Fetch Korean language file
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          $dir = "build\languages"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $path = "Files/Languages/Korean.isl"
          $urls = @(
            "https://raw.githubusercontent.com/jrsoftware/issrc/main/$path"
          )
          foreach ($u in $urls) {
            try {
              Invoke-WebRequest -Uri $u -OutFile "$dir\Korean.isl" -TimeoutSec 30
              Write-Host "Downloaded Korean.isl from $u"
              break
            } catch {
              Write-Host "::warning::다운로드 실패: $u"
            }
          }

      - name: Build installer
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          $suffix = if ("${{ matrix.variant }}" -eq "full") { "-full" } else { "" }
          $isl = "${{ github.workspace }}\build\languages\Korean.isl"
          $args = @(
            "/DAppVersion=$ver",
            "/DNameSuffix=$suffix",
            "/DSourceDir=${{ github.workspace }}\publish",
            "/DOutputDir=${{ github.workspace }}",
            "build\installer.iss"
          )
          if (Test-Path $isl) { $args = @("/DKoreanISL=$isl") + $args }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" @args
          Get-ChildItem *.exe | ForEach-Object { Write-Host $_.Name }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Resenz-${{ matrix.arch }}-${{ matrix.variant }}
          path: |
            Resenz-*.zip
            Resenz-*-setup.exe
          if-no-files-found: warn

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        shell: pwsh
        run: Get-ChildItem artifacts -Recurse | Select-Object Name, Length

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: false
